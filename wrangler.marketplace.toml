name = "market-place"
main = "apps/worker/src/marketplace-worker.ts"
compatibility_date = "2026-04-01"
# No custom-domain route is configured: the API is served on workers.dev and
# the Pages build calls it via VITE_API_BASE.

[vars]
MARKETPLACE_ORIGIN = "https://max-games.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "portal-os1-production1-db"
database_id = "73b4f0ee-5eb1-4ccd-9b50-1ec9ab39532b"
migrations_dir = "apps/worker/d1/migrations"
# Add CUSTOMER_IDENTITY, PAYMENTS and DOWNLOADS Worker service bindings once
# the corresponding trusted adapters are implemented and deployed.
# No public endpoint accepts payment or execution success from a browser.

[triggers]
crons = ["*/5 * * * *"]
